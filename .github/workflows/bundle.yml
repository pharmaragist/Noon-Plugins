name: bundle

# Packs plugins/<group>/<slug>/ into zips and regenerates plugins.json.
# Both are generated artifacts: they are published to the `dist` branch and
# never committed to `main`, which stays source-only.
# plugins.json points download links at `dist` and previews at `main`.

on:
  push:
    branches: [main]
    paths:
      - "plugins/**"
      - "assets/**"
      - "tools/bundle_all.sh"
      - ".github/workflows/bundle.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bundle-main
  cancel-in-progress: true

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pack zips and regenerate plugins.json
        env:
          PREVIEW_BASE: https://raw.githubusercontent.com/${{ github.repository }}/main
          DOWNLOAD_BASE: https://raw.githubusercontent.com/${{ github.repository }}/dist
        run: bash tools/bundle_all.sh

      - name: Publish zips + index to dist branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tmp=$(mktemp -d)
          mkdir -p "$tmp/zip"
          cp -r zip/. "$tmp/zip/"
          cp plugins.json "$tmp/plugins.json"
          cd "$tmp"
          git init -q
          git checkout -q -b dist
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "build: zips + index for ${GITHUB_SHA}"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" dist
          echo "published $(find zip -name '*.zip' | wc -l) zips and plugins.json to dist"
