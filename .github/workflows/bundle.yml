name: bundle

# Packs plugins/<group>/<slug>/ into zips and regenerates plugins.json.
# Zips are published to the `dist` branch; main stays source-only.
# plugins.json (on main) points download links at `dist` and previews at `main`.

on:
  push:
    branches: [main]
    paths:
      - "plugins/**"
      - "assets/**"
      - "tools/bundle_all.sh"
      - ".github/workflows/bundle.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bundle-main
  cancel-in-progress: true

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pack zips and regenerate plugins.json
        env:
          PREVIEW_BASE: https://raw.githubusercontent.com/${{ github.repository }}/main
          DOWNLOAD_BASE: https://raw.githubusercontent.com/${{ github.repository }}/dist
        run: bash tools/bundle_all.sh

      - name: Commit plugins.json if it changed
        run: |
          set -euo pipefail
          if git diff --quiet -- plugins.json; then
            echo "plugins.json is already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add plugins.json
          git commit -m "chore: regenerate plugins.json [skip ci]"
          git pull --rebase --autostash origin main
          git push origin HEAD:main

      - name: Publish zips to dist branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tmp=$(mktemp -d)
          mkdir -p "$tmp/zip"
          cp -r zip/. "$tmp/zip/"
          cd "$tmp"
          git init -q
          git checkout -q -b dist
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "build: zips for ${GITHUB_SHA}"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" dist
          echo "published $(find zip -name '*.zip' | wc -l) zips to dist"
